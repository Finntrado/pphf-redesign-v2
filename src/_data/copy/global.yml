footerAbout: >-
  People to People Health Foundation is a not-for-profit (Section 8) public health organisation,
  founded in 2016. With communities, governments and companies, we strengthen health systems,
  improve access to quality care and deliver locally driven solutions across India.
regShort: Section 8 not-for-profit, registered with the Ministry of Corporate Affairs, Government of India (2016)

