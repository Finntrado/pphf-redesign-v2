# Copy for /deesha/ (moved out of the template so a redesign never touches the words).
title: DEESHA
byline: Diabetes (Type 1) Education and Empowerment Strategic Health Alliance
heading: DEESHA
lead: (Action Group for Type 1 Diabetes Mellitus Children in India) The Alliance is an informal, apolitical, interest group
  of stakeholders.
crumbs:
- label: Our Work
  href: /our-work/
consensus:
- There is a need to advocate for improved policies, strategies, and operating systems for improved financing for T1D children.
- Collectively work in developing a national plan with stakeholders including the government for equitable coverage, outcomes,
  and resource allocations for T1D children.
- Create a multi-stakeholder platform of diverse organizations and work as a task force on key issues to deliver products/strategies
  (short, medium, and long-term) for the stakeholders.
purpose:
- Raising awareness, foster collaboration, and advocate for improved programs on diabetes with a special focus on T1D
- Serves as a unique platform for bringing together key stakeholders to advocate for improved policies, programs and increased
  financing for sustain support on T1D
- National observatory of issues and best practices
- Providing policy and program recommendations and developing position papers based on contemporary evidence
- Provide a platform to showcase effective interventions for scaling
- Partner for increased collaboration and leverage private sector good practices
- Support and supplement government initiatives
- Act as an advisory body on DM related technical and other issues to Government and other institutions
- Promote coordination among ministries, development partners, private sector and other NGOs, international and UN agencies
  responsible for implementing T1D program
- Knowledge Management- Provide required tools for program advocacy, implementation and monitoring
phases:
- group: Short Term
  periods:
  - when: 6 months
    items:
    - Establish a secretariat of DEESHA.
    - Develop strategy for DEESHA (operating model, action groups and membership).
    - Formation of action groups on themes or subthemes (financing, insurance, livelihood models, awareness and education,
      access to medicine, supply chain)
    - Support action groups and meetings and assist in the implementation of action group activities.
  - when: 6-12 months
    items:
    - Develop knowledge products, publications, position papers. technical briefs, communication, and other resource material.
    - Organize an annual conference on critical topics of importance to the national program and policy stakeholders.
    - Active participation in govt. forums, meetings and other engagements would be an integral part of advocacy efforts to
      ensure the achievement of desired objectives.
- group: Medium and Long Term
  periods:
  - when: 12-36 months
    items:
    - Bring Type 1 DM into the public and political domain.
    - Higher budgetary allocation for Type 1 DM interventions.
    - Increasing access to affordable and quality medication for Type 1 DM.
    - Increase community awareness and access to related services.
    - Improve supply chain for sustainable access to Type 1 DM medicines and availability of diagnostics.
    - Improve Health Management Information System to have better epidemiological data on Type 1 DM for better programming.
    - DEESHA will have a mandate for influencing all relevant stakeholders in driving successful T1D outcomes.
  - when: 3-5 years
    items:
    - Opportunities for establishing and improving legislations, policies and implementation practices.
    - Regularly conduct events, seminars and conferences serving as a platform for networking, best practice sharing and knowledge
      exchange amongst members.
    - Provide opportunities for members to voice their concerns.
    - Facilitate design and maintenance of a KM portal and ensure effective capturing, archiving and sharing of knowledge
      from multiple sources with members through the portal.
model:
- structure: Action Groups
  composition: Smaller groups of 5-6 key experts and members on different sub-themes such as financing, insurance, livelihood
    models, awareness and education, access to medicine, and supply chain. Having 1-2 facilitators.
  functions: Work as Action Groups on key issues and subthemes and delivers products/strategies etc. for DEESHA members.
- structure: DEESHA Secretariat
  composition: The Secretariat will be responsible for providing administrative and content support to action groups and facilitating
    services to members
  functions: Secretariat will be responsible for regular day-to-day decision making in running the DEESHA activities
- structure: DEESHA Apex Advisory Committee
  composition: 5-7 members representative of action groups and/or other independent members.
  functions: Apex body responsible for all strategic decision-making. The apex decision-making body for all workplan activities
    and Scope of Work. All time-sensitive, critical decisions and conflict resolution in case of no consensus.
secretariat:
- Maintain files and essential documents
- Support action/working group
- Provide document preparation services
- Hire and support consultants for specialized assignments, as requested
- Contribute to strategic and administrative planning
- Contribute to technical and advocacy initiatives and events
- Provide logistic support to members
