callTitle: PPHF PULSE Fund 2026 — Call for Applications
callIntro: To mark ten years of catalysing change, People to People Health Foundation (PPHF) invites applications from Indian non-profit organisations to become one of up to five PPHF PULSE Partners.
pillarsTitle: Three support pillars
pillarsIntro: The first cohort funds up to five agencies for 12 months (December 2026 – November 2027), backed by PPHF technical support for each agency.
budgetNote: Applicants do not submit a budget with the application. PPHF will invite the 10–12 shortlisted agencies to submit a detailed 12-month budget, so that effort is spent only where an award is realistic.
queries: For any queries regarding the application process, please contact
fine: PPHF reserves the right to accept or reject any application, to modify or cancel the call or any award, and to make fewer than five awards, without assigning reasons. Full terms are available with the application form.
