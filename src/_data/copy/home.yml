route:
  label: Where your support goes
  title: How your support travels, <em>hand to hand</em>.
  hint: "Keep scrolling, and follow the thread"
  intro: >-
    PPHF builds "win-win" partnerships step by step, leveraging government and corporate resources
    for greater impact and coverage (the PPP model). This is the route a rupee takes.
  steps:
    - who: You
      title: A gift, a grant, a partnership
      text: Individuals, companies and institutions fund the work. 90% of PPHF's funding comes from private sources.
      note: you are here
    - who: PPHF
      image: building-partnership-1.webp
      alt: PPHF and partners at a partnership signing
      title: Public &amp; private sector collaboration
      text: >-
        We work with government and stakeholders, leveraging partnerships, and put 90% of funds into programme
        implementation, with robust M&amp;E and partnership management.
    - who: The health system
      image: health-system-strengthening-1.webp
      alt: Health workers at a strengthened health facility
      title: Health system strengthening
      text: >-
        Technical support on quality public health delivery, capacity strengthening and health technology:
        building the skills of health care workers and the capacity of the local health care system.
    - who: The community
      image: g8a5473-scaled.webp
      alt: Women from the community gathered in a health awareness session
      title: Community mobilisation
      text: Establishing and expanding community support systems, so that care continues long after a programme ends.
    - who: A person
      image: expanding-reach-1.webp
      alt: A PPHF clinic-on-wheels van at a programme site
      title: Access to quality care
      text: Improving access to quality services, close to home.
      quote: When the SBIF Sanjeevani Clinic on Wheels came to our village, the doctor gave me medicines and told me what to eat and do every day. Now I feel stronger.
      quoteBy: Mr. Baisanaba Nial, Balangir, Odisha
    - who: And back again
      image: influencing-policy-1.webp
      alt: PPHF and partners at a policy convening
      title: Policy advocacy &amp; scaling up
      text: >-
        What we learn in the field becomes new knowledge through research and demonstration, then
        advocacy for sustainable programming at scale.
  strategy: Read PPHF Strategy 2030

