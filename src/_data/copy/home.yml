appeal:
  label: Urgent appeal · Bihar floods 2026
  title: Floodwaters reached 48.70 lakh people. Help us reach <em>them</em>.
  text: >-
    Severe monsoon flooding has disrupted homes, livelihoods, healthcare, water and sanitation across Bihar.
    Families face damaged homes and limited access to food, safe water, healthcare and basic household supplies.
    PPHF is coordinating with district administrations and local partners to bring relief to the most affected.
  figures:
    - n: "48.70 lakh"
      label: people affected across 15 districts
    - n: "575"
      label: Gram Panchayats across 88 blocks impacted
    - n: "~1 lakh ha"
      label: of standing crops affected
  needs:
    - title: Humanitarian aid kits
      text: Essential supplies for daily living.
    - title: Support for health camps
      text: Ongoing medical relief where it's needed most.
  photo: flood-photo-2.webp
  photoAlt: Families wading through floodwaters with their livestock in Bihar

