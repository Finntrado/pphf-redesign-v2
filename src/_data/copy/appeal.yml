# Copy for /flood-relief-appeal-2026/ (moved out of the template so a redesign never touches the words).
title: Flood Relief Appeal 2026
description: Bihar Flood Relief Appeal by People to People Health Foundation (PPHF). Flood-affected families urgently need
  relief and essential health services.
ogImage: flood-photo-1.webp
response:
- Targeting flood-affected districts of Bihar, with a focus on hardest-hit areas.
- Coordinating with district administrations, local organizations, and medical professionals to deliver emergency health camps,
  food and nutrition kits, and hygiene and survival kits, including sanitary supplies and medical consultations and medicines
  to provide urgent care.
- Supporting government efforts to control post-flood disease outbreaks.
- Providing rehabilitation and livelihood support for displaced families.
- Continuing extended health services through periodic medical camps.
- Setting up platforms for psychosocial counselling and community preparedness for future disasters.
label: Urgent appeal · Bihar floods 2026
heading: Bihar Flood Relief Appeal by People to People Health Foundation (PPHF)
lead: Flood-affected families urgently need relief and essential health services.
crisis:
  title: 'The 2026 Bihar floods: a growing humanitarian crisis'
  paras:
  - >-
    Severe monsoon flooding has affected communities across Bihar, disrupting homes, livelihoods, agriculture, education,
    healthcare, water and sanitation services. Floodwaters have affected approximately <strong>48.70 lakh people across
    15 districts</strong>, with <strong>575 Gram Panchayats across 88 blocks</strong> impacted. While floodwaters are beginning
    to recede in parts of the state, severe riverbank erosion and potential structural failures continue to pose risks to
    affected communities. Standing crops across approximately 1 lakh hectares have been affected, impacting around
    <strong>35.89 lakh people across 491 Gram Panchayats</strong>.
  - Families are facing disruptions to essential services, loss of livelihoods, damaged homes and limited access to food,
    safe water, healthcare and basic household supplies.
  - PPHF is closely monitoring the situation and coordinating with local partners to mobilize urgent support for the most affected.
