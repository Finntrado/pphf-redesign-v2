title: Internship
heading: Internship Opportunities
crumbs:
- label: Get Involved
label: Opportunity
roles:
- title: Communications Intern
  kind: Internship
  location: New Delhi
  email: career@pphfglobal.org
  summary: >-
    <strong>Position Summary:</strong> The Communications Intern will support the Communications team in enhancing the
    organization’s visibility and public image. This role requires a proactive individual who is eager to learn and contribute
    to various aspects of communication, including documentation, event coordination, and social media management. The ideal
    candidate will have a keen interest in digital marketing, strong organizational skills, and the ability to work in a
    fast-paced environment.
  responsibilitiesTitle: 'Main responsibilities include but are not limited to:'
  responsibilities:
  - title: Documentation Support
    items:
    - Assist in creating, editing, and producing collaterals such as brochures, press releases, etc.
    - Support the development of communication or promotional materials.
  - title: Event Coordination
    items:
    - Assist in planning and managing events in coordination with internal and external stakeholders.
    - Coordinate logistics with vendors and partners to ensure successful event execution.
    - Support on-the-ground activities during events, including setup, registration, and attendee management.
  - title: Social Media and Digital Marketing
    items:
    - Help develop and implement strategies for social media platforms (Facebook, Twitter, Instagram, LinkedIn, YouTube).
    - Create engaging social media posts and visual content aligned with ongoing campaigns.
  qualificationsTitle: Qualifications and Skills
  qualifications:
  - Currently pursuing or recently completed a degree in Communications, Marketing, Journalism, Public Relations, or a related field.
  - Strong written and verbal communication skills in English; proficiency in Hindi is an advantage.
  - Basic knowledge of content management systems and social media management tools.
  - Strong organizational skills and the ability to manage multiple tasks simultaneously.
  - Creative thinking and problem-solving abilities.
  deadline: Last date of receiving applications is July 20, 2024.
  process: Interested candidates should send a Covering Letter mentioning the job title in the subject line along with their recent CV as a word document attachment and send it to email
